<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; connect-src 'self' https://x402-tokens.fly.dev https://x402.accrue.fund https://api.mainnet-beta.solana.com https://zoo.openzoo.fun https://openzoo.fun; img-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-src 'self' https://zoo.openzoo.fun https://*.openzoo.fun; media-src 'self';">
  <title>OpenZoo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #0A080D; }
    body {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; min-height: 100vh;
      font-family: ui-rounded, "SF Pro Rounded", -apple-system, "Segoe UI", sans-serif;
      color: #f4f1fb;
      padding: 28px 20px 56px;
      -webkit-user-select: none; user-select: none;
      -webkit-tap-highlight-color: transparent;
      overflow-y: auto;
    }

    .logo {
      width: 112px; height: 112px; border-radius: 56px;
      margin-bottom: 14px;
      overflow: hidden;
      border: 1px solid rgba(0, 255, 181, 0.28);
      box-shadow: 0 0 36px rgba(224, 5, 246, 0.16);
      background: #1C1628;
    }
    .logo img { width: 100%; height: 100%; display: block; }
    .title {
      font-size: 26px; font-weight: 700; letter-spacing: 6px;
      color: #f4f1fb;
    }
    .sub {
      margin-top: 8px; font-size: 11px; letter-spacing: 2px;
      color: #00FFB5; text-transform: uppercase;
    }
    .divider {
      width: 56px; height: 1px; margin: 16px 0 18px;
      background: linear-gradient(90deg, transparent, #00FFB5, transparent);
    }

    #picker {
      display: flex; flex-direction: column; gap: 12px;
      width: 100%; max-width: 320px;
    }
    .btn {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      color: #fff; padding: 15px 18px;
      font-family: inherit; font-size: 13px;
      letter-spacing: 1.5px; border-radius: 10px;
      cursor: pointer; text-align: center;
      transition: background 0.15s, transform 0.1s, border-color 0.15s;
    }
    .btn:active { background: rgba(255,255,255,0.08); transform: scale(0.97); }
    .btn:disabled { opacity: 0.3; pointer-events: none; }
    .btn.primary {
      border-color: rgba(0, 255, 181, 0.45);
      background: linear-gradient(180deg, rgba(0, 255, 181, 0.16) 0%, rgba(28, 22, 40, 0.4) 100%);
      color: #00FFB5;
    }
    .btn.primary:active { background: rgba(0, 255, 181, 0.14); }
    .btn.danger {
      border-color: rgba(255,80,80,0.2);
      color: rgba(255,255,255,0.5); font-size: 12px; padding: 10px;
    }
    .hint {
      font-size: 11px; line-height: 1.45;
      color: rgba(232, 240, 220, 0.45);
      text-align: center;
    }

    #status {
      margin-top: 14px; font-size: 12px;
      color: rgba(255,255,255,0.38); text-align: center;
      max-width: 320px; word-break: break-all; min-height: 18px;
    }
    #connected {
      display: none; text-align: center;
      margin-top: 16px; width: 100%; max-width: 320px;
    }
    .lbl {
      font-size: 10px; letter-spacing: 3px;
      color: #00FFB5; margin-bottom: 8px;
    }
    .addr {
      font-size: 12px; color: #00FFB5; word-break: break-all;
      padding: 12px 14px; background: #1C1628;
      border-radius: 8px; border: 1px solid rgba(0, 255, 181, 0.2);
      line-height: 1.5; cursor: pointer;
      -webkit-user-select: all; user-select: all;
    }
    #copiedToast {
      position: fixed; z-index: 4000; pointer-events: none; left: 50%; top: 18px;
      padding: 7px 14px; border-radius: 999px; background: #00FFB5; color: #0A080D;
      font: 700 12px/1.2 ui-rounded, "SF Pro Rounded", sans-serif;
      letter-spacing: .06em; opacity: 0; transform: translate(-50%, -6px);
      transition: opacity .14s ease, transform .14s ease;
    }
    #copiedToast.show { opacity: 1; transform: translate(-50%, 0); }
    .powered {
      position: fixed; bottom: 0; left: 0; right: 0;
      text-align: center; padding: 12px;
      font-size: 10px; letter-spacing: 1.6px;
      color: rgba(232, 240, 220, 0.42);
    }

    /* Dark launch loader — covers the blank after native splash / during launchApp.
       No logo. z-index above the game iframe (9999). Background matches config.xml. */
    #oz-boot {
      position: fixed;
      top: 0; right: 0; bottom: 0; left: 0;
      z-index: 10000;
      background: #0A080D;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: lowercase;
      color: rgba(244, 241, 251, 0.48);
    }
    #oz-boot.oz-boot-off { display: none; }
    .oz-boot-dots { display: inline-block; width: 1.4em; text-align: left; }
    .oz-boot-dots span {
      display: inline-block;
      opacity: 0;
      animation: oz-boot-dot 1.2s infinite;
    }
    .oz-boot-dots span:nth-child(2) { animation-delay: 0.2s; }
    .oz-boot-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes oz-boot-dot {
      0%, 20% { opacity: 0; }
      40%, 100% { opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="oz-boot" role="status" aria-live="polite">starting<span class="oz-boot-dots" aria-hidden="true"><span>.</span><span>.</span><span>.</span></span></div>
  <div class="logo" data-component="logo"><img src="mark.png" alt="OpenZoo"></div>
  <div class="title" data-component="title">OPENZOO</div>
  <div class="sub" data-component="subtitle">Play Solana PSG1</div>
  <div class="divider" data-component="divider"></div>

  <div id="picker" data-component="wallet-picker">
    <button class="btn primary" onclick="connectMWA()" data-testid="connect-wallet">
      CONNECT WALLET
    </button>
    <div class="hint">Jupiter Wallet via Mobile Wallet Adapter.<br>Phantom is only a generic-Android test fallback.</div>
    <button class="btn" onclick="launchApp()" data-testid="open-guest">
      OPEN WITHOUT WALLET
    </button>
    <div class="hint">Threads, chat, and wallet. Chat pays via x402 from this wallet.</div>
  </div>

  <div id="status" data-component="status"></div>

  <div id="connected" data-component="connected-panel">
    <div class="lbl" data-component="connected-label">CONNECTED</div>
    <div class="addr" id="addr" data-component="wallet-address" title="Tap to copy"></div>
    <button class="btn primary" onclick="launchApp()" style="margin-top:20px;" data-testid="open-button">
      OPEN OPENZOO
    </button>
    <button class="btn danger" onclick="disconnect()" style="margin-top:8px;" data-testid="disconnect-button">
      DISCONNECT
    </button>
  </div>

  <div id="copiedToast" role="status" aria-live="polite">copied</div>
  <div class="powered" data-component="footer">OpenZoo · Play Solana PSG1</div>

  <!-- Cordova bridge — only exists when served from local www/ -->
  <script src="cordova.js"></script>
  <script>
  'use strict';

  /* ═══════════════════════════════════════════════
     State
     ═══════════════════════════════════════════════ */
  var connectedAddress = null;   // wallet address after connect
  var connectedMethod  = null;   // 'MWA'
  // Bundled OpenZoo UI. Do not point at a remote GAME_URL or a local proxy.
  var GAME_URL    = 'app/index.html';
  var GAME_ORIGIN = '*'; // local file — no meaningful origin; use event.source check instead

  /* ═══════════════════════════════════════════════
     UI helpers
     ═══════════════════════════════════════════════ */
  var $picker    = document.getElementById('picker');
  var $status    = document.getElementById('status');
  var $connected = document.getElementById('connected');
  var $addr      = document.getElementById('addr');
  var $boot      = document.getElementById('oz-boot');
  var bootDismissed = false;
  var bootFallbackTimer = null;
  var bootTimeoutTimer = null;

  function log(msg) {
    console.log('[wallet-shell] ' + msg);
  }

  function showBootOverlay() {
    bootDismissed = false;
    clearTimeout(bootFallbackTimer);
    clearTimeout(bootTimeoutTimer);
    bootFallbackTimer = null;
    bootTimeoutTimer = null;
    if ($boot) $boot.classList.remove('oz-boot-off');
  }

  function hideBootOverlay() {
    if (bootDismissed) return;
    bootDismissed = true;
    clearTimeout(bootFallbackTimer);
    clearTimeout(bootTimeoutTimer);
    bootFallbackTimer = null;
    bootTimeoutTimer = null;
    if ($boot) $boot.classList.add('oz-boot-off');
  }

  function setStatus(msg) {
    var text = String(msg || '');
    var low = text.toLowerCase();
    if (
      low.indexOf('load failed') >= 0 ||
      low.indexOf('failed to fetch') >= 0 ||
      low.indexOf('typeerror') >= 0 ||
      low.indexOf('networkerror') >= 0
    ) {
      text = 'Connection dropped. Return to OpenZoo and retry.';
    }
    $status.textContent = text;
  }

  function postToApp(payload) {
    var iframe = document.getElementById('game');
    if (!iframe || !iframe.contentWindow) return false;
    try {
      iframe.contentWindow.postMessage(payload, GAME_ORIGIN);
      return true;
    } catch (_) {
      return false;
    }
  }

  function notifyAppLifecycle(type) {
    postToApp({ type: type });
  }

  function showCopiedToast() {
    var el = document.getElementById('copiedToast');
    if (!el) return;
    el.textContent = 'copied';
    el.classList.add('show');
    clearTimeout(showCopiedToast._timer);
    showCopiedToast._timer = setTimeout(function () { el.classList.remove('show'); }, 1200);
  }

  function copyTextNative(text, ok, err) {
    var value = String(text == null ? '' : text);
    if (window.MWA && typeof MWA.copyText === 'function') {
      MWA.copyText(value, function () { if (ok) ok(); }, function (e) {
        if (!copyTextFallback(value)) { if (err) err(e); }
        else if (ok) ok();
      });
      return;
    }
    if (copyTextFallback(value)) { if (ok) ok(); }
    else if (err) err('Clipboard unavailable');
  }

  function copyTextFallback(value) {
    try {
      if (navigator.clipboard && navigator.clipboard.writeText && window.isSecureContext) {
        navigator.clipboard.writeText(value);
        return true;
      }
    } catch (_) {}
    try {
      var ta = document.createElement('textarea');
      ta.value = value;
      ta.style.cssText = 'position:fixed;top:-1000px;left:-1000px;opacity:0';
      ta.setAttribute('readonly', '');
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, ta.value.length);
      var copied = document.execCommand('copy');
      document.body.removeChild(ta);
      return !!copied;
    } catch (_) {
      return false;
    }
  }

  function showConnected(address, method) {
    connectedAddress = address;
    connectedMethod  = method;

    $picker.style.display = 'none';
    $connected.style.display = 'block';
    $addr.textContent = address;
    $addr.title = 'Tap to copy';
    setStatus('');
    log('Connected: ' + address.slice(0, 8) + '...' + address.slice(-4));
  }

  function launchApp() {
    // Re-show the dark loader for the blank between tap and first grokui paint.
    // Stay up across iframe create — do not hide here. App posts openzoo-chrome-ready.
    showBootOverlay();
    $picker.style.display = 'none';
    $connected.style.display = 'none';

    var old = document.getElementById('game');
    if (old) old.remove();

    var iframe = document.createElement('iframe');
    iframe.id = 'game';
    iframe.allow = 'fullscreen';
    iframe.style.cssText = 'position:fixed;top:0;left:0;width:100vw;height:100vh;border:none;z-index:9999;';
    document.body.appendChild(iframe);

    iframe.addEventListener('load', function onBootFallback() {
      iframe.removeEventListener('load', onBootFallback);
      bootFallbackTimer = setTimeout(hideBootOverlay, 50);
    });
    bootTimeoutTimer = setTimeout(hideBootOverlay, 4000);

    if (connectedAddress) {
      var sendWalletInfo = function() {
        iframe.contentWindow.postMessage({
          type: 'wallet-connected',
          address: connectedAddress,
          method: connectedMethod
        }, GAME_ORIGIN);
        log('Sent wallet-connected to iframe');
      };

      iframe.addEventListener('load', function onLoad() {
        iframe.removeEventListener('load', onLoad);
        setTimeout(sendWalletInfo, 800);
      });
    }

    iframe.src = GAME_URL;
    log('Loading OpenZoo iframe...');
  }

  function disconnect() {
    var iframe = document.getElementById('game');
    if (iframe && connectedAddress) {
      try {
        iframe.contentWindow.postMessage({ type: 'wallet-disconnected' }, GAME_ORIGIN);
      } catch (_) {}
    }

    if (iframe) iframe.remove();

    $picker.style.display = 'flex';
    $connected.style.display = 'none';
    connectedAddress = null;
    connectedMethod  = null;
    setStatus('');
    log('Disconnected');
  }

  /* ═══════════════════════════════════════════════
     Wallet connect — MWA (Native Plugin)
     Jupiter Wallet on PSG1; any MWA wallet on generic Android.
     ═══════════════════════════════════════════════ */
  function connectMWA() {
    if (!window.MWA) {
      log('MWA plugin not loaded');
      setStatus('Wallet unavailable — needs a PSG1 (Jupiter Wallet) or generic Android + MWA wallet');
      return;
    }
    setStatus('Opening wallet...');
    log('MWA: calling native authorize...');

    MWA.authorize(
      function(result) {
        log('Authorized: ' + result.address.slice(0, 8) + '...');
        showConnected(result.address, 'MWA');
      },
      function(err) {
        log('Connect failed: ' + err);
        setStatus(err.replace(/^MWA[: ]+/i, ''));
      }
    );
  }

  /* ═══════════════════════════════════════════════
     postMessage bridge — listen for app requests
     ═══════════════════════════════════════════════ */
  window.addEventListener('message', function(event) {
    var gameFrame = document.getElementById('game');
    if (!gameFrame || event.source !== gameFrame.contentWindow) return;
    var data = event.data;
    if (!data || !data.type) return;

    if (data.type === 'openzoo-chrome-ready') {
      log('Chrome ready — dismissing launch overlay');
      hideBootOverlay();
    }

    if (data.type === 'wallet-disconnect') {
      log('App requested disconnect');
      disconnect();
    }

    if (data.type === 'wallet-request-info' && connectedAddress) {
      var iframe = document.getElementById('game');
      iframe.contentWindow.postMessage({
        type: 'wallet-connected',
        address: connectedAddress,
        method: connectedMethod
      }, GAME_ORIGIN);
      log('Re-sent wallet info to iframe');
    }

    if (data.type === 'wallet-copy-text') {
      var copyIframe = document.getElementById('game');
      copyTextNative(data.text, function () {
        copyIframe.contentWindow.postMessage({
          type: 'wallet-copy-text-response',
          id: data.id,
          ok: true
        }, GAME_ORIGIN);
      }, function (err) {
        copyIframe.contentWindow.postMessage({
          type: 'wallet-copy-text-response',
          id: data.id,
          ok: false,
          error: err || 'copy failed'
        }, GAME_ORIGIN);
      });
    }

    // Sign a message with the connected MWA wallet (native approval dialog)
    if (data.type === 'wallet-sign-message') {
      log('Sign request (message) — id:' + data.id);
      var signIframe = document.getElementById('game');
      var respond = function(payload) {
        payload.type = 'wallet-sign-response';
        payload.id = data.id;
        signIframe.contentWindow.postMessage(payload, GAME_ORIGIN);
      };
      if (connectedMethod === 'MWA' && window.MWA) {
        var messageB64 = btoa(String.fromCharCode.apply(null, new TextEncoder().encode(data.message)));
        MWA.signMessage(messageB64,
          function(result) { log('Signed message (MWA)'); respond({ signature: result.signature }); },
          function(err)    { log('Sign failed: ' + err); respond({ error: err }); }
        );
      } else {
        respond({ error: 'No wallet connected' });
      }
    }

    // Partial-sign an x402 payment tx. NEVER signAndSendTransaction —
    // that submits the tx and breaks settlement (feePayer must complete it).
    if (data.type === 'wallet-sign-transaction') {
      log('Sign request (transaction) — id:' + data.id);
      var txIframe = document.getElementById('game');
      var respondTx = function(payload) {
        payload.type = 'wallet-sign-transaction-response';
        payload.id = data.id;
        txIframe.contentWindow.postMessage(payload, GAME_ORIGIN);
      };
      if (connectedMethod === 'MWA' && window.MWA) {
        var txB64 = data.transaction || data.txB64 || '';
        MWA.signTransaction(txB64,
          function(result) {
            log('Signed transaction (MWA)');
            respondTx({ signedTransaction: result.signedTransaction });
          },
          function(err) { log('Tx sign failed: ' + err); respondTx({ error: err }); }
        );
      } else {
        respondTx({ error: 'No wallet connected' });
      }
    }

    // Wrap / top-up MAY broadcast. Never use this path for x402 payment.
    if (data.type === 'wallet-sign-and-send-transaction') {
      log('Sign+send request (wrap) — id:' + data.id);
      var sendIframe = document.getElementById('game');
      var respondSend = function(payload) {
        payload.type = 'wallet-sign-and-send-response';
        payload.id = data.id;
        sendIframe.contentWindow.postMessage(payload, GAME_ORIGIN);
      };
      if (connectedMethod === 'MWA' && window.MWA && MWA.signAndSendTransaction) {
        var wrapB64 = data.transaction || data.txB64 || '';
        MWA.signAndSendTransaction(wrapB64,
          function(result) {
            log('Signed and sent wrap (MWA)');
            respondSend({ signature: result.signature });
          },
          function(err) { log('Wrap send failed: ' + err); respondSend({ error: err }); }
        );
      } else {
        respondSend({ error: 'No wallet connected' });
      }
    }
  });

  /* ═══════════════════════════════════════════════
     Init
     ═══════════════════════════════════════════════ */
  log('Shell loaded');

  // First-run CONNECT / guest picker: overlay is only for launchApp blanks.
  document.addEventListener('DOMContentLoaded', function () {
    hideBootOverlay();
  });

  $addr.addEventListener('click', function () {
    if (!connectedAddress) return;
    copyTextNative(connectedAddress, function () { showCopiedToast(); });
  });

  document.addEventListener('deviceready', function() {
    log('deviceready');
    document.addEventListener('pause', function () {
      log('pause — persist 402 across MWA');
      notifyAppLifecycle('app-pause');
    }, false);
    document.addEventListener('resume', function () {
      log('resume — retry pay/build if a 402 is waiting');
      notifyAppLifecycle('app-resume');
    }, false);
  }, false);

  document.addEventListener('visibilitychange', function () {
    notifyAppLifecycle(document.hidden ? 'app-pause' : 'app-resume');
  });
  window.addEventListener('pageshow', function () { notifyAppLifecycle('app-resume'); });
  </script>
</body>
</html>
